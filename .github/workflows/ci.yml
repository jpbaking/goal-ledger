name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    name: Validator tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v
      - name: Check Claude skill mirror is byte-identical
        run: diff -r .agents/skills .claude/skills
      - name: Check every SKILL.md is under agy's 24,000-byte limit
        run: |
          python3 - <<'PY'
          import glob, os, sys
          big = [(p, os.path.getsize(p)) for p in glob.glob(".agents/skills/*/SKILL.md") if os.path.getsize(p) >= 24000]
          for p, n in big:
              print(f"{p}: {n} bytes (limit 24000)")
          sys.exit(1 if big else 0)
          PY

  windows:
    name: Windows validator tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
